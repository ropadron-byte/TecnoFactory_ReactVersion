<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración — Tecno Factory</title>
<link rel="stylesheet" href="../../css/estilos.css">
<link rel="stylesheet" href="../../css/admin.css">
<script src="../../js/usuarios.js"></script>
<script src="../../js/admin-guard.js"></script>
</head>
<body>

<div class="admin-wrap">
  <nav class="admin-sidebar">
    <div class="admin-nav-top">
      <a href="home.html" aria-current="page"><span class="icon">🏠</span> Inicio</a>
      <a href="usuario.html" data-admin-only><span class="icon">👤</span> Usuarios</a>
      <a href="producto.html"><span class="icon">📦</span> Productos</a>
    </div>
    <div class="admin-nav-bottom">
      <a href="#"><span class="icon">👤</span> Perfil</a>
    </div>
  </nav>

  <main class="admin-content">
    <header class="admin-header">
      <h1 id="saludo-admin">¡Hola!</h1>
      <span class="admin-bell" aria-hidden="true">🔔</span>
    </header>

    <section>
      <div class="admin-panel">
        <p>Resumen general de la tienda.</p>
      </div>

      <div class="admin-panel">
        <p>Actividad reciente.</p>
      </div>
    </section>

    <footer class="admin-footer">
      <p>© 2026 Tecno Factory — Panel de administración</p>
    </footer>
  </main>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var sesion = obtenerSesion();
    if (sesion) {
      document.getElementById("saludo-admin").textContent = "¡Hola, " + sesion.nombre + "!";
    }
  });
</script>

</body>
</html>
