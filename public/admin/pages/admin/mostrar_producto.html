<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle producto — Panel Tecno Factory</title>
<link rel="stylesheet" href="../../css/estilos.css">
<link rel="stylesheet" href="../../css/admin.css">
<script src="../../js/usuarios.js"></script>
<script src="../../js/admin-guard.js"></script>
</head>
<body>

<div class="admin-wrap">
  <nav class="admin-sidebar">
    <div class="admin-nav-top">
      <a href="home.html"><span class="icon">🏠</span> Inicio</a>
      <a href="usuario.html" data-admin-only><span class="icon">👤</span> Usuarios</a>
      <a href="producto.html" aria-current="page"><span class="icon">📦</span> Productos</a>
    </div>
    <div class="admin-nav-bottom">
      <a href="#"><span class="icon">👤</span> Perfil</a>
    </div>
  </nav>

  <main class="admin-content">
    <header class="admin-header">
    <h1 id="titulo-producto">Detalle de producto</h1>
    </header>
    
    <section>
    <div class="admin-panel">
      <div class="media" id="d-imagen-principal" style="width:120px; height:120px; margin-bottom:12px;"></div>
      <div class="product-thumbs" id="d-imagenes" style="margin-top:0; margin-bottom:18px;"></div>
      <div class="spec-list">
        <div class="spec-row"><span>Código</span><span id="d-codigo"></span></div>
        <div class="spec-row"><span>Nombre</span><span id="d-nombre"></span></div>
        <div class="spec-row"><span>Descripción</span><span id="d-descripcion"></span></div>
        <div class="spec-row"><span>Categoría</span><span id="d-categoria"></span></div>
        <div class="spec-row"><span>Precio</span><span id="d-precio"></span></div>
        <div class="spec-row"><span>Stock</span><span id="d-stock"></span></div>
        <div class="spec-row"><span>Stock crítico</span><span id="d-stock-critico"></span></div>
      </div>

      <p style="margin-top:24px;">
        <a class="btn accent small" id="btn-editar" href="#" data-admin-only>Editar</a>
        <a class="btn ghost small" href="producto.html">← Volver al listado</a>
      </p>
    </div>
  </section>
  
  <footer class="admin-footer">
  <p>© 2026 Tecno Factory — Panel de administración</p>
  </footer>
  </main>
</div>

<script src="../../js/productos.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get("codigo");
    const producto = codigo ? obtenerProductoPorCodigo(codigo) : null;

    if (!producto) {
      document.querySelector(".admin-content").innerHTML = "<h1>Producto no encontrado</h1><p><a class='btn ghost' href='producto.html'>Volver al listado</a></p>";
      return;
    }

    document.getElementById("d-imagen-principal").innerHTML = mediaProductoHTML(producto);
    const imagenes = imagenesProducto(producto);
    if (imagenes.length > 1) {
      const thumbsWrap = document.getElementById("d-imagenes");
      imagenes.forEach(function (url) {
        const thumb = document.createElement("div");
        thumb.className = "product-thumb";
        thumb.innerHTML = '<img src="' + escapeAttr(url) + '" alt="">';
        thumbsWrap.appendChild(thumb);
      });
    }

    document.getElementById("titulo-producto").textContent = producto.nombre;
    document.getElementById("d-codigo").textContent = producto.codigo;
    document.getElementById("d-nombre").textContent = producto.nombre;
    document.getElementById("d-descripcion").textContent = producto.descripcion || "Sin descripción";
    document.getElementById("d-categoria").textContent = producto.categoria;
    document.getElementById("d-precio").textContent = formatCLP(producto.precio);
    document.getElementById("d-stock").textContent = producto.stock + " unidades";
    document.getElementById("d-stock-critico").textContent = producto.stockCritico ? producto.stockCritico + " unidades" : "No definido";
    document.getElementById("btn-editar").href = "editar_producto.html?codigo=" + encodeURIComponent(producto.codigo);
  });
</script>

</body>
</html>
